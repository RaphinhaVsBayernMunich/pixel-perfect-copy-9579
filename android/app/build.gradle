apply plugin: 'com.android.application'

android {
    namespace = "app.questos.android"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.questos.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv("QUESTOS_VERSION_CODE") ?: "2")
        versionName System.getenv("QUESTOS_VERSION_NAME") ?: "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Signing secrets come from the build environment, never checked-in properties.
def releaseStore = System.getenv('QUESTOS_KEYSTORE_PATH')
if (releaseStore) {
    android.signingConfigs.create('questosRelease') {
        storeFile file(releaseStore)
        storePassword System.getenv('QUESTOS_KEYSTORE_PASSWORD')
        keyAlias System.getenv('QUESTOS_KEY_ALIAS')
        keyPassword System.getenv('QUESTOS_KEY_PASSWORD')
    }
    android.buildTypes.release.signingConfig = android.signingConfigs.questosRelease
}
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        if (!releaseStore || !System.getenv('QUESTOS_KEYSTORE_PASSWORD') || !System.getenv('QUESTOS_KEY_ALIAS') || !System.getenv('QUESTOS_KEY_PASSWORD')) throw new GradleException('Release signing is not configured.')
        def configFile = file('src/main/assets/capacitor.config.json')
        if (!configFile.exists()) throw new GradleException('Run Capacitor sync with the approved HTTPS server origin first.')
        def nativeConfig = new groovy.json.JsonSlurper().parse(configFile)
        def origin = new URI(nativeConfig.server?.url ?: '')
        def host = origin.host?.toLowerCase() ?: ''
        def forbidden = ['lovable.app', 'lovable.dev', 'lovableproject.com', 'lovableproject-dev.com', 'gpt-eng.com', 'gptengineer.run']
        if (origin.scheme != 'https' || !host || origin.rawUserInfo || origin.rawQuery || origin.rawFragment || origin.port != -1 || !(origin.path in ['', '/']) || host.contains('id-preview') || host == 'localhost' || host.endsWith('.localhost') || host.contains(':') || host ==~ /^(127\.|0\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.).*/ || forbidden.any { host == it || host.endsWith('.' + it) } || host ==~ /.*\.(invalid|example|test)$/) throw new GradleException('Release requires an independent public HTTPS app origin without credentials, path, port, query or fragment.')
    }
}
